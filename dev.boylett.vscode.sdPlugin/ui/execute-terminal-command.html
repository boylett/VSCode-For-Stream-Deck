<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Execute Terminal Command</title>
    <link rel="stylesheet" href="_pi.css" />
    <script src="_pi.js"></script>
  </head>
  <body>
    <div class="field">
      <label for="command">Command</label>
      <textarea id="command" placeholder="npm run dev"></textarea>
    </div>
    <div class="hint">Sent to the currently active VS Code terminal as if you typed it.</div>

    <details>
      <summary>Documentation</summary>
      <div class="docs">
        <p>
          Requires a terminal to already be open and focused in VS Code. Use the
          <strong>Create Terminal</strong> action if you need to open one first.
        </p>
      </div>
    </details>

    <script>
      initPropertyInspector([
        { id: "command", type: "textarea" },
      ]);
    </script>
  </body>
</html>
